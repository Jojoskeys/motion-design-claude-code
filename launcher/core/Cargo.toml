[package]
name = "hangar-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Coeur du launcher Hangar : catalogue signé, installation, mises à jour et lancement"

[lib]
name = "hangar_core"
path = "src/lib.rs"

[[bin]]
name = "hangar-tools"
path = "src/bin/hangar-tools.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
semver = { version = "1", features = ["serde"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "default-tls", "http2", "charset"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
tempfile = "3"
