  // S15: morning light, same frame, then the lamp goes out

  ft(98.1, "#streaks", { opacity: 0.5 }, { opacity: 0.3, duration: 1.2, ease: "sine.out" });

  ft(100.95, "#flash", { opacity: 0 }, { opacity: 0.85, duration: 0.5, ease: "power2.in" });
  fadeOut(101.45, "#flash", 0.55, 0.85);
  roomVisible(101.8, false);

  // =====================================================================================
  // S16 · 101.40-108.0 · end: the facade in the morning; slow pull back, then stop; image held after the voice.
  // =====================================================================================
  sd = 1600;
  const s16 = build("sc16", [
    { d: 0.4, svg: svg(() => layer("M-400 -1000H1480V2600H-400Z", grad([[0, "#5a76a0"], [0.45, "#7f98bd"], [0.7, "#c8c8c0"], [1, "#e8d4b0"]])) +
      `<g id="s16-clouds" filter="url(#f-blur-md)">` + Array.from({ length: 4 }, (_, i) => `<path d="M ${R(-400, 300).toFixed(0)} ${120 + i * 120} q 180 -60 380 -10 q 180 -50 320 10 q 120 10 160 40 h -860 z" fill="#eef0f2" opacity="${(0.45 - i * 0.06).toFixed(2)}"/>`).join("") + `</g>`) },

      s += `<rect x="124" y="384" width="892" height="22" fill="#5a463c"/><g filter="url(#f-paint)">`;
      for (let r = 0; r < 9; r++) for (let c = 0; c < 3; c++) {

      }
      return s + `</g>`;

    { svg: svg(() => FINISH()) },

  fadeIn(101.2, s16.w, 0.45);

  cam(s16, { x: 0, y: 70, z: 1.0 }, 101.3, 3.9, "power2.inOut");

  ft(102.2, "#s16-curL", { scaleX: 1, svgOrigin: "480 1000" }, { scaleX: 0.75, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 1 });
  ft(101.6, "#s16-beam", { opacity: 0.08 }, { opacity: 0.22, duration: 4.5, ease: "sine.inOut" });
  const tEnd = mk("ttl", "Ad-Duha · Comprendre les premiers versets<span></span>", "t-end");
  tEnd.style.color = "#13203f";
  ft(105.2, tEnd, { opacity: 0, y: 8 }, { opacity: 0.95, y: 0, duration: 0.8, ease: "power2.out" });
  pictos("pic-b", [["heart", 430, 104.16], ["share", 540, 104.72], ["bell", 650, 105.65]], 1212, 0);

})();
