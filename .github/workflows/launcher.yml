# Rayan's Launcher (launcher) : tests du coeur sous Linux et Windows, parcours de bout en bout dans la vraie
# application, puis installateurs Windows (NSIS et MSI) et paquets de démonstration en « Artifacts ».
name: Rayan's Launcher

on:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (tests + parcours dans l'application)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Dépendances système de Tauri et WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev webkit2gtk-driver xvfb
      - run: npm ci
      - name: Tests du coeur (dont les 5 parcours sur le vrai binaire de démo)
        run: npm test
      - name: Application de test (mode développement, interface embarquée)
        run: npx tauri build --debug --no-bundle
      - run: cargo install tauri-driver --locked
      - name: Parcours de bout en bout dans l'application (clics réels)
        run: xvfb-run -a npm run e2e:ui
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: rayans-launcher-captures-linux
          path: launcher/e2e-output/

  windows:
    name: Windows (tests, parcours, installateurs)
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: launcher
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Tests du coeur (dont les 5 parcours sur RayansChrono.exe)
        run: npm test
      - name: Pilote Edge assorti au WebView2 installé
        shell: pwsh
        timeout-minutes: 5
        run: |
          $v = (Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}').pv
          Write-Host "WebView2 $v"
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath ..\out\driver -Force
          Get-ChildItem ..\out\driver
      - name: Parcours de bout en bout dans l'application (WebView2 + msedgedriver)
        id: e2e_windows
        timeout-minutes: 25
        continue-on-error: true
        run: |
          npx tauri build --debug --no-bundle
          cargo install tauri-driver --locked
          TAURI_NATIVE_DRIVER="$(cd ../out/driver && pwd -W)/msedgedriver.exe" npm run e2e:ui
      - name: Signaler le résultat du parcours Windows
        if: steps.e2e_windows.outcome != 'success'
        run: echo "::warning title=Parcours UI Windows::Le parcours par clics sous Windows n'a pas abouti (environnement de test WebDriver). Les tests du coeur, eux, sont bloquants et passent."
      - name: Paquets de démonstration Windows (v1 et v2) et catalogue local
        run: |
          node scripts/demo.mjs init
          node scripts/demo.mjs add
      # Version 0.1.<numéro d'exécution> : chaque construction est une mise à jour pour le launcher installé.
      # Signature Authenticode seulement si les secrets WINDOWS_CERTIFICATE (fichier .pfx en base64) et
      # WINDOWS_CERTIFICATE_PASSWORD existent ; sinon installateurs non signés, comme avant.
      - name: Réglages de construction (version, signature éventuelle)
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PWD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $conf = [ordered]@{ version = "0.1.$env:GITHUB_RUN_NUMBER" }
          if ($env:CERT_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
            $pass = ConvertTo-SecureString $env:CERT_PWD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pass
            Remove-Item $pfx
            $conf.bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } }
            Write-Host "Signature Authenticode activée ($($cert.Subject))"
          } else {
            Write-Host "::notice title=Authenticode::Aucun certificat (secret WINDOWS_CERTIFICATE) : installateurs non signés."
          }
          $conf | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 ../out-tauri-ci.json
          Get-Content ../out-tauri-ci.json
      - name: Installateur de test (mode développement autorisé)
        run: |
          npx tauri build --features dev-mode --config ../out-tauri-ci.json
          rm -rf ../out/driver
          mkdir -p ../out/developpement
          cp target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi ../out/developpement/
          mkdir -p ../out-maj && cp target/release/bundle/nsis/*-setup.exe ../out-maj/
      - name: Installateur de distribution (HTTPS et signature obligatoires)
        run: |
          npx tauri build --config ../out-tauri-ci.json
          mkdir -p ../out/distribution
          cp target/release/bundle/nsis/*.exe target/release/bundle/msi/*.msi ../out/distribution/
      - uses: actions/upload-artifact@v5
        with:
          name: rayans-launcher-installateurs-windows
          path: out/
      # À déposer tel quel dans « À ajouter » : le launcher installé propose alors la mise à jour.
      - uses: actions/upload-artifact@v5
        with:
          name: Rayans-Launcher-mise-a-jour
          path: out-maj/
          compression-level: 0
      - uses: actions/upload-artifact@v5
        with:
          name: rayans-launcher-catalogue-demo-windows
          path: launcher/dev-catalog/
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: rayans-launcher-captures-windows
          path: launcher/e2e-output/
